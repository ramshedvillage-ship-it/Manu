[build]
  base = "."
  command = "npm run build"
  publish = "site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/results"
  to = "/.netlify/functions/results"
  status = 200
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/api/source-check"
  to = "/.netlify/functions/source-check"
  status = 200
  force = true
